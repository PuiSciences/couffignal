name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 👇 NOUVEAU : Setup Node.js (version LTS recommandée)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # ou 18 si ton projet n'est pas compatible avec v20

      # 👇 NOUVEAU : Installe les dépendances et lance le build
      - name: Install and Build
        run: |
          npm ci
          npm run build  # 👈 Assure-toi que cette commande existe dans ton package.json

      # 👇 MODIFIÉ : Upload UNIQUEMENT le dossier de build (ex: dist/, build/, public/)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # 👈 Remplace par le dossier généré par `npm run build` (ex: "build", "public")

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
