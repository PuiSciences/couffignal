<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Escape game QR — Lycée Couffignal</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; background: #D4D4D4; color: #fff; display: flex; justify-content: center; padding: 20px; }
  .wrap { width: 100%; max-width: 680px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .header h1 { font-size: 1.35rem; }
  .badge { background: #1e293b; color: #cbd5e1; font-size: .8rem; padding: 6px 14px; border-radius: 999px; }
  .progress { height: 8px; background: #1e293b; border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .progress > div { height: 100%; background: #10b981; transition: width .5s; }
  .card { background: #1e293b; border-radius: 18px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,.4); margin-bottom: 16px; }
  .video-zone { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 16/9; background: #0b1220; }
  .video-zone iframe { width: 100%; height: 100%; border: 0; }
  .video-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #64748b; text-align: center; padding: 20px; }
  .video-placeholder .emoji { font-size: 3rem; }
  h2.instruction { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
  p.sub { color: #94a3b8; font-size: .95rem; margin-bottom: 18px; }
  .status { border-radius: 12px; padding: 14px; margin-bottom: 16px; display: none; }
  .status.show { display: block; animation: pop .25s ease; }
  .status.ok { background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.4); color: #34d399; font-weight: 600; }
  .status.ko { background: rgba(225,29,72,.15); border: 1px solid rgba(225,29,72,.4); color: #fb7185; font-weight: 600; }
  #cam { width: 100%; border-radius: 12px; background: #000; display: none; }
  #cam.active { display: block; }
  .choices { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .choice { width: 100%; text-align: left; padding: 13px 16px; border-radius: 12px; border: 1px solid #475569; background: #334155; color: #fff; font-size: 1rem; cursor: pointer; transition: background .15s; }
  .choice:hover:not(:disabled) { background: #475569; }
  .choice:disabled { cursor: default; }
  .choice.correct { background: #059669; border-color: #34d399; }
  .choice.wrong { background: #e11d48; border-color: #fb7185; }
  .choice.dim { opacity: .5; }
  .btn { display: inline-block; padding: 12px 22px; border: none; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; color: #fff; transition: filter .15s; margin-top: 14px; }
  .btn:hover { filter: brightness(1.1); }
  .btn.green { background: #10b981; }
  .btn.blue { background: #2563eb; }
  .btn.gray { background: #475569; }
  .btn-full { display: block; width: 100%; }
  .scanline { position: relative; }
  .scanline::after { content: ""; position: absolute; left: 5%; width: 90%; height: 3px; background: #34d399; border-radius: 3px; top: 8px; animation: scan 2s linear infinite; opacity: .8; }
  @keyframes scan { 0% { top: 8px; } 50% { top: calc(100% - 10px); } 100% { top: 8px; } }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .end { text-align: center; }
  .end .emoji { font-size: 4rem; margin-bottom: 12px; }
  .end h2 { font-size: 1.8rem; margin-bottom: 8px; }
  .end p { color: #94a3b8; margin-bottom: 20px; }
  .footnote { text-align: center; color: #64748b; font-size: .8rem; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>
	<img src="https://puisciences.github.io/couffignal/logo_strasbourg_300dpi.jpg" alt="Logo de Strasbourg" height="35"> &ensp; Escape Couff'
	
	
	</h1>
    <span class="badge" id="badge"></span>
  </div>
  <div class="progress"><div id="bar" style="width:0%"></div></div>

  <!-- Lecteur vidéo (en haut) -->
  <div class="card video-zone" id="videoZone">
    <div class="video-placeholder" id="videoPlaceholder">
      <div class="emoji">🎬</div>
      <p>La vidéo de l'étape s'affichera ici<br>après le scan du bon QR code.</p>
    </div>
  </div>

  <!-- Zone scan + question -->
  <div class="card" id="quizCard">
    <h2 class="instruction" id="instruction"></h2>
    <p class="sub" id="sub"></p>

    <div class="status" id="status"></div>

    <div class="scanline" id="camWrap" style="display:none">
      <video id="cam" playsinline></video>
    </div>
    <button class="btn blue" id="startBtn">📷 Activer la caméra</button>
    <button class="btn gray" id="stopBtn" style="display:none">⏹ Arrêter la caméra</button>

    <div class="choices" id="choices" style="display:none"></div>
    <div id="nextWrap"></div>
  </div>

  <p class="footnote">La caméra reste active uniquement pendant le scan. Aucune image n'est enregistrée.</p>
</div>

<script>
// ==== Étapes de l'escape game (modifiable) ====
// "qr"     = contenu EXACT du QR code collé dans la salle
// "video"  = URL de la vidéo en mode intégration (embed PeerTube)
// "q"      = la question posée après la vidéo
// "correct"= position de la bonne réponse (0 = A, 1 = B, ...)
const STEPS = [
  {
    salle: "la salle C115",
    instruction: "Étape 1 — Scanner le QR code de la salle C115",
    qr: "http://edurl.fr/iTpj77J5",
    video: "https://tube-sciences-technologies.apps.education.fr/videos/embed/oST62iJKm9syGaQ7ZWr6NS",
    q: "En Sciences et Labo, quelle est la ville qui a été visitée par les élèves ?",
    choices: ["Nice", "Paris", "Lyon", "Strasbourg"],
    correct: 1,
    hint: "La Tour Eiffel...",
    success: "🏛️ Direction la salle C315 !",
  },
  {
    salle: "la salle C315",
    instruction: "Étape 2 — Scanner le QR code de la salle C315",
    qr: "http://edurl.fr/iTpj77J5",
    video: "https://tube-sciences-technologies.apps.education.fr/videos/embed/tSKtvcfnLhSABmmkH7shBY",
    q: "L'option NSI est-elle disponible au lycée Couffignal ?",
    choices: ["Non, seulement en terminale", "Oui, dès la 1ère", "Non, pas du tout", "Oui, mais seulement en seconde"],
    correct: 1,
    hint: "On peut la choisir en fin de seconde...",
    success: "🚀 Direction le bâtiment F (Da Vinci), salle 123 !",
  },
  {
    salle: "le bâtiment F, salle 123",
    instruction: "Étape 3 — Scanner le QR code du bâtiment F, salle 123",
    qr: "http://edurl.fr/iTpj77J5",
    video: "https://tube-sciences-technologies.apps.education.fr/videos/embed/upUSWydnFtxSw2gsT3zu5t",
    q: "Qui est le plus beau prof de l'option de seconde ?",
    choices: ["Fred", "Virgile", "Virgile et Fred", "Personne"],
    correct: 2,
    hint: "Impossible de choisir entre les deux...",
    success: "🏆 Escape game terminé. Tu peux rejoindre la salle C69!",
  },
];
// ====================================================

const badge = document.getElementById("badge");
const bar = document.getElementById("bar");
const videoZone = document.getElementById("videoZone");
const videoPlaceholder = document.getElementById("videoPlaceholder");
const instructionEl = document.getElementById("instruction");
const subEl = document.getElementById("sub");
const statusEl = document.getElementById("status");
const cam = document.getElementById("cam");
const camWrap = document.getElementById("camWrap");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const choicesEl = document.getElementById("choices");
const nextWrap = document.getElementById("nextWrap");

let step = 0;
let answered = false;
let stream = null;
let scanning = false;

// ---------- Sauvegarde de la progression (localStorage) ----------
const STORAGE_KEY = "escapeCouffProgress";

function saveState(phase) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ step: step, phase: phase }));
  } catch (e) {}
}

function loadState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch (e) {
    return null;
  }
}

function clearState() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {}
}

function keyOf(url) {
  return url.replace(/\/+$/, "").split("/").pop().toLowerCase();
}

function isMatch(scanned) {
  return scanned.trim().toLowerCase().includes(keyOf(STEPS[step].qr));
}

function showStatus(ok, msg) {
  statusEl.className = "status show " + (ok ? "ok" : "ko");
  statusEl.textContent = msg;
}

// ---------- Phase 1 : le scan ----------
function renderScanPhase() {
  const s = STEPS[step];
  answered = false;
  choicesEl.style.display = "none";
  choicesEl.innerHTML = "";
  nextWrap.innerHTML = "";
  startBtn.style.display = "inline-block";
  badge.textContent = "Étape " + (step + 1) + " / " + STEPS.length;
  instructionEl.textContent = s.instruction;
  subEl.textContent = "Scanne le QR code affiché dans la salle pour débloquer la vidéo et la question.";
  statusEl.className = "status";
}

// ---------- Phase 2 : la question ----------
function renderQuizPhase() {
  const s = STEPS[step];
  choicesEl.style.display = "flex";
  choicesEl.innerHTML = "";
  s.choices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = "<b>" + String.fromCharCode(65 + i) + ".</b> " + c;
    btn.onclick = () => choose(i);
    choicesEl.appendChild(btn);
  });
}

function choose(i) {
  if (answered) return;
  answered = true;
  const s = STEPS[step];
  const ok = i === s.correct;
  const buttons = choicesEl.querySelectorAll(".choice");
  buttons.forEach((b, j) => {
    b.disabled = true;
    if (j === s.correct) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  if (ok) {
    showStatus(true, "✅ " + s.success);
    bar.style.width = ((step + 1) / STEPS.length * 100) + "%";
    const nextBtn = document.createElement("button");
    nextBtn.className = "btn green btn-full";
    nextBtn.textContent = (step + 1 < STEPS.length) ? "Étape suivante →" : "Terminer l'escape game 🎉";
    nextBtn.onclick = () => {
      nextWrap.innerHTML = "";
      step++;
      if (step < STEPS.length) {
        const old = videoZone.querySelector("iframe");
        if (old) old.remove();
        videoPlaceholder.style.display = "flex";
        renderScanPhase();
        saveState("scan");
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        endScreen();
      }
    };
    nextWrap.appendChild(nextBtn);
  } else {
    showStatus(false, "❌ Faux ! 💡 Indice : " + s.hint);
    const retry = document.createElement("button");
    retry.className = "btn gray btn-full";
    retry.textContent = "↩️ Réessayer";
    retry.onclick = () => {
      nextWrap.innerHTML = "";
      answered = false;
      buttons.forEach((b) => { b.disabled = false; b.classList.remove("correct", "wrong", "dim"); });
      statusEl.className = "status";
    };
    nextWrap.appendChild(retry);
  }
}

// ---------- Caméra ----------
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    cam.srcObject = stream;
    await cam.play();
    cam.classList.add("active");
    camWrap.style.display = "block";
    startBtn.style.display = "none";
    stopBtn.style.display = "inline-block";
    showStatus(true, "🔎 Caméra active — vise le QR code de " + STEPS[step].salle);
    scanning = true;
    tick();
  } catch (e) {
    showStatus(false, "❌ Impossible d'accéder à la caméra. Vérifie l'autorisation, ou ouvre cette page via un serveur (l'accès caméra peut être bloqué en ouvrant le fichier directement).");
  }
}

function stopCamera() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  cam.srcObject = null;
  cam.classList.remove("active");
  camWrap.style.display = "none";
  startBtn.style.display = "inline-block";
  stopBtn.style.display = "none";
}

const canvas = document.createElement("canvas");

function tick() {
  if (!scanning) return;
  if (cam.readyState === cam.HAVE_ENOUGH_DATA) {
    canvas.width = cam.videoWidth;
    canvas.height = cam.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
    if (code && code.data) {
      handleScan(code.data);
      return;
    }
  }
  requestAnimationFrame(tick);
}

function handleScan(data) {
  if (isMatch(data)) {
    stopCamera();
    saveState("quiz"); // progression enregistrée : vidéo + question débloquées
    const s = STEPS[step];
    showStatus(true, "✅ QR code reconnu ! Regarde la vidéo puis réponds à la question.");

    // Affiche la vidéo dans le lecteur en haut
    videoPlaceholder.style.display = "none";
    const iframe = document.createElement("iframe");
    iframe.src = s.video + "?autoplay=1";
    iframe.allow = "fullscreen; autoplay";
    iframe.allowFullscreen = true;
    videoZone.appendChild(iframe);

    // Affiche la question
    instructionEl.textContent = "❓ Question " + (step + 1);
    subEl.textContent = s.q;
    renderQuizPhase();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    showStatus(false, "❌ Ce n'est pas le bon QR code ! Cherche " + STEPS[step].salle + ".");
    setTimeout(() => { if (scanning) tick(); }, 1200);
  }
}

function endScreen() {
  badge.textContent = "";
  bar.style.width = "100%";
  clearState(); // cache effacé : l'escape game est terminé
  document.querySelector(".wrap").innerHTML =
    '<div class="card end">' +
    '<div class="emoji">🏆</div>' +
    "<h2>Escape game terminé !</h2>" +
    "<p>Tu as trouvé les 3 QR codes, regardé les 3 vidéos et répondu aux 3 questions. Bravo ! 🎉</p>" +
    '<button class="btn green" onclick="location.reload()">🔄 Recommencer</button>' +
    "</div>";
}

startBtn.onclick = startCamera;
stopBtn.onclick = stopCamera;

// ---------- Restauration de la progression après F5 ----------
function restoreFromCache() {
  const saved = loadState();
  if (saved && Number.isInteger(saved.step) && saved.step >= 0 && saved.step < STEPS.length) {
    step = saved.step;
    if (saved.phase === "quiz") {
      // l'étape était déjà débloquée : on remet la vidéo + la question, sans re-scanner
      const s = STEPS[step];
      videoPlaceholder.style.display = "none";
      const iframe = document.createElement("iframe");
      iframe.src = s.video;
      iframe.allow = "fullscreen; autoplay";
      iframe.allowFullscreen = true;
      videoZone.appendChild(iframe);
      instructionEl.textContent = "❓ Question " + (step + 1);
      subEl.textContent = s.q;
      renderQuizPhase();
      showStatus(true, "✅ Étape restaurée ! Regarde la vidéo et réponds à la question.");
    } else {
      renderScanPhase();
    }
  } else {
    renderScanPhase();
  }
}

restoreFromCache();
</script>
</body>
</html>
