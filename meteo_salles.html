<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌡️ Météo des salles - Laboratoire Couffignal</title>
    <link rel="stylesheet" href="ms/style.css">
</head>
<body>
    <h1>🌡️ Météo des salles - Laboratoire Couffignal</h1>
    <p>  🖥️ Si l'écran d'ordinateur ne s'allume pas : allumer le vidéoprojecteur</p>
    <p>  ⛓️‍💥latis pro : bug si ordi trop vieux, notament ultra sons</p>
    <!-- Filtres -->
    <div class="filters">
        <button onclick="filterProblems('all')">Tous les problèmes</button>
        <button onclick="filterProblems('ticket')">Tickets (Maintenance)</button>
        <button onclick="filterProblems('labo')">Boulot Labo</button>
        <button onclick="generateTicketList()">📋 Liste des tickets à copier</button>
    </div>

    <!-- Tableau de bord -->
    <div class="dashboard" id="dashboard"></div>

    <!-- Liste copiable des tickets, groupée par salle -->
    <div id="ticketListWrap">
        <h2>📋 Liste des tickets (copier/coller)</h2>
        <textarea id="ticketListOutput" readonly></textarea>
        <div class="filters">
            <button onclick="copyTicketList()">📋 Copier</button>
        </div>
    </div>

    <!-- Liste des problèmes -->
    <div class="problems" id="problemsList"></div>

    <!-- data.js DOIT être chargé avant script.js -->
    <script src="ms/data.js"></script>
    <script src="ms/script.js"></script>
</body>
</html>
